name: Auto PR and Merge

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  auto-create-pr:
    name: Auto Create PR
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check if main branch exists
        id: check-main
        run: |
          if git ls-remote --heads origin main | grep -q main; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create main branch if not exists
        if: steps.check-main.outputs.exists == 'false'
        run: |
          echo "⚠️ Main branch does not exist. Please create it manually via GitHub web UI."
          echo "See SETUP_MAIN_BRANCH.md for instructions."
          exit 0

      - name: Check if PR already exists
        id: check-pr
        if: steps.check-main.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq 'length')
          if [ "$PR_EXISTS" -gt 0 ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "✅ PR already exists: #$PR_NUMBER"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📝 No existing PR found"
          fi

      - name: Get commit summary
        id: commit-summary
        if: steps.check-main.outputs.exists == 'true' && steps.check-pr.outputs.exists == 'false'
        run: |
          # Get latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get commit statistics
          FILES_CHANGED=$(git diff --name-only origin/main..HEAD | wc -l)
          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create-pr
        if: steps.check-main.outputs.exists == 'true' && steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract branch name without prefix
          BRANCH_NAME="${{ github.ref_name }}"
          FEATURE_NAME=$(echo "$BRANCH_NAME" | sed 's/claude\///' | sed 's/-[^-]*$//')

          # Create PR with template
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "🚀 Auto PR: $FEATURE_NAME" \
            --body "$(cat <<'EOF_BODY'
## 🤖 Auto-generated Pull Request

This PR was automatically created from branch \`${{ github.ref_name }}\`.

### 📊 Summary
- **Branch**: \`${{ github.ref_name }}\`
- **Author**: @${{ github.actor }}
- **Files Changed**: ${{ steps.commit-summary.outputs.files_changed }}
- **Latest Commit**:
  \`\`\`
  ${{ steps.commit-summary.outputs.message }}
  \`\`\`

### 🚀 Deployment
- ✅ Preview deployment will be available automatically
- ✅ Auto-merge is enabled (after checks pass)

### 📋 Checklist
- [x] Code changes committed
- [x] Branch pushed to GitHub
- [x] PR created automatically
- [ ] Preview deployment successful
- [ ] All checks passed
- [ ] Auto-merge completed

---

> 💡 **Auto-merge**: This PR will automatically merge into \`main\` after all required checks pass.

EOF_BODY
          )")

          echo "url=$PR_URL" >> $GITHUB_OUTPUT

          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

          echo "✅ Created PR #$PR_NUMBER: $PR_URL"

      - name: Use existing PR number
        id: pr-number
        if: steps.check-pr.outputs.exists == 'true'
        run: |
          echo "pr-number=${{ steps.check-pr.outputs.number }}" >> $GITHUB_OUTPUT

  enable-auto-merge:
    name: Enable Auto-Merge
    needs: auto-create-pr
    runs-on: ubuntu-latest
    if: needs.auto-create-pr.outputs.pr-number != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ needs.auto-create-pr.outputs.pr-number }}"

          # Enable auto-merge with squash merge
          gh pr merge "$PR_NUMBER" --auto --squash

          echo "✅ Auto-merge enabled for PR #$PR_NUMBER"
          echo "🔄 PR will automatically merge after all checks pass"

      - name: Add labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          PR_NUMBER="${{ needs.auto-create-pr.outputs.pr-number }}"
          gh pr edit "$PR_NUMBER" --add-label "auto-merge,automated-pr"

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🎉 Auto PR & Merge Configured

          **PR Number**: #${{ needs.auto-create-pr.outputs.pr-number }}
          **Branch**: \`${{ github.ref_name }}\`
          **Auto-merge**: ✅ Enabled

          ### Next Steps:
          1. ⏳ Waiting for Vercel deployment to complete
          2. ⏳ Waiting for all status checks to pass
          3. 🚀 Auto-merge will trigger automatically

          ### View PR:
          https://github.com/${{ github.repository }}/pull/${{ needs.auto-create-pr.outputs.pr-number }}
          EOF
